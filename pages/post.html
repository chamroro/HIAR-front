  <script type="module">
    import { db, storageRef } from '../config.js';

    const ready = window.HIAR_I18N_READY || Promise.resolve();
    const urlParams = window.location.search.substring(1);
    const postId = urlParams ? urlParams : null;

    ready.then(() => {
      const titleField = window.getI18nValue("pages.post.titleField") || "title";
      const subField = window.getI18nValue("pages.post.subField") || "sub";
      const errorNotFound = window.getI18nValue("pages.post.errorNotFound") || "";
      const errorGeneric = window.getI18nValue("pages.post.errorGeneric") || "";
      const errorInvalidId = window.getI18nValue("pages.post.errorInvalidId") || "";

      if (postId) {
        db.collection('posts').doc(postId).get().then((postInfo) => {
          if (postInfo.exists) {
            const convertDate = (date) => {
              var d = date.toString();
              return d.substr(4, 11);
            };

            var date = convertDate(postInfo.data().uploadDate.toDate());
            const data = postInfo.data().id;

            const contents = `
              <h2 class="title">${postInfo.data()[titleField]}</h2>
              <div class="meta-top">
                <ul>
                  <li class="d-flex align-items-center date"><i class="bi bi-clock"></i>${date}</li>
                </ul>
              </div>
              <div class="content">
                <p>${postInfo.data()[subField]}</p>
              </div>
            `;

            document.querySelector('.blog-details').insertAdjacentHTML('afterbegin', contents);

            if (postInfo.data().images) {
              postInfo.data().images.forEach(function (image) {
                const oneImage = `
                  <div style="margin-bottom:10px;">
                    <img style="width: 100%;" src=${image} alt="">
                  </div>
                `;
                document.querySelector('.blog-details').insertAdjacentHTML('beforeend', oneImage);
              });
            }

            if (postInfo.data().pdf) {
              const fileData = `
                <div class="files d-flex align-items-center ">
                  <img style="width:16px; margin-left:0;margin-right: 8px;" src='assets/img/icon_file.svg'>
                  <a href="${postInfo.data().pdf}" style="color: #6c757d; font-size: 14px;">${postInfo.data().pdfTitle}</a>
                </div>
              `;
              document.querySelector('.blog-details').insertAdjacentHTML('beforeend', fileData);
            }

          } else {
            document.querySelector('.blog-details').innerHTML = `<p>${errorNotFound}</p>`;
          }
        }).catch((error) => {
          console.error("Error getting document:", error);
          document.querySelector('.blog-details').innerHTML = `<p>${errorGeneric}</p>`;
        });
      } else {
        document.querySelector('.blog-details').innerHTML = `<p>${errorInvalidId}</p>`;
      }
    });
  </script>
